services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - kairo_mongo:/data/db

  api:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      JWT_SECRET: change-this-in-production
      CLIENT_ORIGIN: http://localhost:5173
      MONGODB_URI: mongodb://mongo:27017/kairo
      AI_SERVICE_URL: http://ai:8000
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NIM_BASE_URL: https://integrate.api.nvidia.com/v1
      NIM_MODEL: meta/muse-glimmer-30b
      NIM_REASONING_EFFORT: low
    depends_on:
      - mongo
      - ai

  ai:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}

volumes:
  kairo_mongo: